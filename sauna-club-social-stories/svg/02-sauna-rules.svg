<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><title>Sauna rules — sauna club story template by DIVELUX (CC BY 4.0)</title><rect id="background" width="1080" height="1920" fill="#fffdf9"/><g id="art"><rect id="band" x="0" y="0" width="1080" height="690" fill="#efe9df"/></g><g id="text"><g id="club"><g id="club-club-name"><text id="club-club-name-left" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="32" fill="#1b1512"><tspan x="96" y="307.6">Your Sauna Club</tspan></text><text id="club-club-name-right" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="32" fill="#1b1512" text-anchor="end"><tspan x="984" y="307.6">House rules</tspan></text></g></g><g id="head"><text id="head-title" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="168" fill="#1b1512" letter-spacing="-3.36"><tspan x="96" y="502.7">Sauna</tspan><tspan x="96" y="657.3">rules</tspan></text></g><g id="list"><g id="list-rule-1"><text id="list-rule-1-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="785.9">1</tspan></text><text id="list-rule-1-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="787.5">Shower before you go in.</tspan></text><path d="M96 821.5H984" stroke="#e3ddd3" stroke-width="2"/></g><g id="list-rule-2"><text id="list-rule-2-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="887.4">2</tspan></text><text id="list-rule-2-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="889.0">Sit on a towel, always.</tspan></text><path d="M96 923.0H984" stroke="#e3ddd3" stroke-width="2"/></g><g id="list-rule-3"><text id="list-rule-3-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="988.9">3</tspan></text><text id="list-rule-3-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="990.5">Ask before you pour water on the</tspan><tspan x="169.6" y="1048.0">stones.</tspan></text><path d="M96 1082.0H984" stroke="#e3ddd3" stroke-width="2"/></g><g id="list-rule-4"><text id="list-rule-4-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="1147.9">4</tspan></text><text id="list-rule-4-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="1149.5">Keep voices low. Phones stay</tspan><tspan x="169.6" y="1207.0">outside.</tspan></text><path d="M96 1241.0H984" stroke="#e3ddd3" stroke-width="2"/></g><g id="list-rule-5"><text id="list-rule-5-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="1306.9">5</tspan></text><text id="list-rule-5-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="1308.5">No alcohol before or in the sauna.</tspan></text><path d="M96 1342.5H984" stroke="#e3ddd3" stroke-width="2"/></g><g id="list-rule-6"><text id="list-rule-6-n" font-family="'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif" font-weight="700" font-size="46" fill="#1b1512"><tspan x="96" y="1408.4">6</tspan></text><text id="list-rule-6-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="46" fill="#1b1512"><tspan x="169.6" y="1410.0">Feel unwell? Leave the heat right</tspan><tspan x="169.6" y="1467.5">away.</tspan></text><path d="M96 1501.5H984" stroke="#e3ddd3" stroke-width="2"/></g><text id="list-thanks" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="38" fill="#6f655c"><tspan x="96" y="1580.0">Thank you for keeping this a calm, friendly</tspan><tspan x="96" y="1629.4">place.</tspan></text></g></g><g id="credit"><text id="credit-removable" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="22" fill="#6f655c" text-anchor="middle"><tspan x="540" y="1849.2">Template by DIVELUX · diveluxsaunahat.com</tspan></text></g></svg>