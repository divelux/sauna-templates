pan></text></g><g id="list-bring-2"><rect x="98" y="1077.7" width="31.7" height="31.7" rx="5" fill="none" stroke="#3d332c" stroke-width="3"/><text id="list-bring-2-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="44" fill="#1b1512"><tspan x="166.4" y="1109.5">A water bottle</tspan></text></g><g id="list-bring-3"><rect x="98" y="1176.7" width="31.7" height="31.7" rx="5" fill="none" stroke="#3d332c" stroke-width="3"/><text id="list-bring-3-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="44" fill="#1b1512"><tspan x="166.4" y="1208.5">Flip-flops</tspan></text></g><g id="list-bring-4"><rect x="98" y="1275.7" width="31.7" height="31.7" rx="5" fill="none" stroke="#3d332c" stroke-width="3"/><text id="list-bring-4-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="44" fill="#1b1512"><tspan x="166.4" y="1307.5">A swimsuit, if your session needs one</tspan></text></g><g id="list-bring-5"><rect x="98" y="1374.7" width="31.7" height="31.7" rx="5" fill="none" stroke="#3d332c" stroke-width="3"/><text id="list-bring-5-text" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="44" fill="#1b1512"><tspan x="166.4" y="1406.5">A wool sauna hat, worn dry</tspan></text></g><text id="list-note" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="40" fill="#3d332c"><tspan x="96" y="1520.6">Arrive 15 minutes early and we will show you</tspan><tspan x="96" y="1572.6">around.</tspan></text></g></g><g id="credit"><text id="credit-removable" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="22" fill="#6f655c" text-anchor="middle"><tspan x="540" y="1849.2">Template by DIVELUX · diveluxsaunahat.com</tspan></text></g></svg>